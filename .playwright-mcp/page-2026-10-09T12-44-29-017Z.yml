        - generic [ref=f6e413]:
          - button [ref=f6e414] [cursor=pointer]:
            - generic [ref=f6e415]: What is Artha Sutram?
            - generic: In Vedic tradition, Artha is one of the four Purusharthas, the four goals of a complete human life. It means prosperity, livelihood, and material wellbeing. Not just money, but the full architecture of a meaningful working life. Sutram means thread. In Sanskrit, a Sutra is a condensed thread of wisdom that ties complex knowledge into something you can hold and actually use. The Yoga Sutras of Patanjali. The Brahma Sutras. A Sutram is not a summary. It is a precise guide. Artha Sutram is exactly that. A precise thread of wealth wisdom pulled from your Vedic birth chart. It has 23 sections. Each one looks at a different part of your financial life. Your active wealth yogas and when each one peaks. Your strongest planets for money, the income paths that suit your chart. The pattern that keeps your savings from growing. Your complete Dasha timeline with what each period is asking you to do. Gemstones and mantras prescribed for your specific chart. And a personal letter from Vaani at the end. Everything in it is specific to you. Nothing applies to anyone else.
          - 'button "How is this different from a regular astrology reading? Artha Sutram translates your Vedic birth chart into decisions you can actually make. It tells you which income paths your chart supports, based on the strength of your specific houses and planetary positions. It shows you who belongs close to you professionally and who does not. It maps your Mahadasha and Antardasha timeline so you know which years to push hard and which years to protect what you have built. The section called What Works Against You is where most people say it gets real. It finds the one pattern in your chart that quietly resets your savings. It shows you exactly what that looks like in your day to day financial decisions. And it gives you one fix you can put in place right now to multiply your current income. Every section is built to answer one question: given your chart, what do you actually do?" [ref=f6e418] [cursor=pointer]':
